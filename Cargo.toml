[workspace]
members = [
    "contracts/agent-escrow",
    "contracts/sponsored-fee-vault",
    "contracts/payment-router",
    "shared",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

# Soroban SDK 21.x targets Stellar Protocol 21
