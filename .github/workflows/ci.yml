name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --all -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Build WASM
        run: cargo build --release --target wasm32-unknown-unknown -p agent-escrow -p sponsored-fee-vault -p payment-router
